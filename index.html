<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Ghép Đối Đầu - WebSockets</title>
</head>
<body>
    <div style="padding: 20px; font-family: sans-serif;">
        <h2>Trạng thái: <span id="status" style="color: orange;">Đang kết nối...</span></h2>
        <button onclick="sendMatchRequest()">Gửi Yêu Cầu Ghép Trận</button>
        <div id="messages" style="margin-top: 20px; padding: 10px; background: #f4f4f4;"></div>
    </div>

    <script>
        // Thay bằng domain thật của Worker sau khi deploy
        const WORKER_URL = 'wss://hendy-websocket-server.YOUR_SUBDOMAIN.workers.dev/ws/matchmaking';
        const ws = new WebSocket(WORKER_URL);
        const statusEl = document.getElementById('status');
        const msgsEl = document.getElementById('messages');

        ws.onopen = () => {
            statusEl.innerText = "Đã kết nối";
            statusEl.style.color = "green";
        };

        ws.onmessage = (event) => {
            const p = document.createElement('p');
            p.innerText = event.data;
            msgsEl.appendChild(p);
        };

        ws.onclose = () => {
            statusEl.innerText = "Mất kết nối";
            statusEl.style.color = "red";
        };

        function sendMatchRequest() {
            if (ws.readyState === WebSocket.OPEN) {
                const payload = {
                    action: "FIND_MATCH",
                    userId: "USER_" + Math.floor(Math.random() * 1000)
                };
                ws.send(JSON.stringify(payload));
            } else {
                alert("WebSocket chưa sẵn sàng!");
            }
        }
    </script>
</body>
</html>
